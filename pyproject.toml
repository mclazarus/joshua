[project]
name = "joshua"
version = "0.1.0"
description = "Joshua: a WarGames-flavored Slack bot that nags WarGear players when it's their turn."
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20",
    "cryptography>=43",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "slack-bolt>=1.21",
    "slack-sdk>=3.33",
    "aiohttp>=3.10",
]

[project.scripts]
joshua = "joshua.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joshua"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.uv]
python-preference = "only-managed"

[tool.ruff.lint.per-file-ignores]
"src/joshua/__main__.py" = ["ASYNC240"]  # one-off CLI file writes
